[project]
name = "ren2024-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "crsec-tools",
]

[tool.uv.workspace]
members = ["tools"]

[tool.uv.sources]
crsec-tools = { workspace = true }
# runvault の Python 側 (run ディレクトリの読み取り)．Rust 側と同じリポジトリの
# python/ サブディレクトリにある．
runvault = { git = "https://github.com/akitenkrad/rs-runvault", subdirectory = "python" }
